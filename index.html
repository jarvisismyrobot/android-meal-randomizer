<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>煮乜食 v2</title>
<style>
  :root {
    --paper: #FAF5EC;
    --surface: #FFFDF7;
    --ink: #2A2118;
    --ink-soft: #6E5C49;
    --persimmon: #E8590C;
    --persimmon-dark: #C24A08;
    --line: #E8DECB;
    --bf-bg: #FFF3D6; --bf-ink: #8A6D00;
    --lu-bg: #FFE8D9; --lu-ink: #C24E0C;
    --di-bg: #E4E9FB; --di-ink: #3F51B5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: var(--paper); color: var(--ink);
    max-width: 640px; margin: 0 auto; padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  header { padding: 12px 4px 16px; }
  header .hi { font-size: 22px; font-weight: 700; }
  header .date { color: var(--ink-soft); font-size: 14px; margin-top: 4px; }
  .hero {
    background: var(--ink); color: #FAF5EC;
    border-radius: 20px; padding: 20px; margin-bottom: 16px;
  }
  .hero .label { font-size: 13px; opacity: .7; }
  .hero .dishes { font-size: 20px; font-weight: 700; margin: 8px 0 12px; line-height: 1.5; }
  .hero button {
    background: var(--persimmon); color: #fff; border: 0;
    border-radius: 999px; padding: 10px 20px; font-size: 15px; font-weight: 700;
    cursor: pointer;
  }
  .hero button:active { background: var(--persimmon-dark); }
  .week {
    display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px;
  }
  .day {
    flex: 1 0 0; min-width: 64px; text-align: center;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 4px; cursor: pointer;
  }
  .day .d { font-size: 15px; font-weight: 700; }
  .day .n { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .day.active { background: var(--ink); color: #FAF5EC; border-color: var(--ink); }
  .day.active .n { color: #FAF5EC; opacity: .7; }
  .meal {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 12px;
  }
  .meal .row { display: flex; align-items: center; justify-content: space-between; }
  .meal .tag {
    font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 12px;
  }
  .tag.bf { background: var(--bf-bg); color: var(--bf-ink); }
  .tag.lu { background: var(--lu-bg); color: var(--lu-ink); }
  .tag.di { background: var(--di-bg); color: var(--di-ink); }
  .meal .dishes { font-size: 17px; margin-top: 10px; line-height: 1.6; }
  .shuffle {
    border: 1px solid var(--line); background: none; color: var(--ink-soft);
    border-radius: 999px; padding: 6px 14px; font-size: 14px; cursor: pointer;
  }
  .shuffle:active { background: var(--line); }
  .actions { display: flex; gap: 10px; margin: 20px 0 40px; }
  .actions button {
    flex: 1; padding: 14px; border-radius: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; border: 0;
  }
  .primary { background: var(--persimmon); color: #fff; }
  .primary:active { background: var(--persimmon-dark); }
  .ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line) !important; }
  footer { text-align: center; color: var(--ink-soft); font-size: 12px; padding-bottom: 24px; }
</style>
</head>
<body>
<header>
  <div class="hi" id="greeting">今日食乜？</div>
  <div class="date" id="today"></div>
</header>

<div class="hero">
  <div class="label" id="heroLabel">今晚食乜</div>
  <div class="dishes" id="heroDishes"></div>
  <button onclick="shuffleMeal(selectedDay, 'DINNER')">成餐換 🔀</button>
</div>

<div class="week" id="week"></div>
<div id="meals"></div>

<div class="actions">
  <button class="primary" onclick="generateWeek()">重新計劃一週 🍳</button>
  <button class="ghost" onclick="shuffleMeal(selectedDay, 'DINNER')">今晚重抽</button>
</div>

<footer>煮乜食 v2 · web 版</footer>

<script>

": "豉椒炒蜆", "categories": ["DINNER"]}, {"name": "清炒時蔬", "categories": ["DINNER", "VEGETARIAN", "HEALTHY"]}, {"name": "蛋撻", "categories": ["DESSERT", "SNACK"]}, {"name": "咖喱魚蛋", "categories": ["SNACK", "LUNCH"]}, {"name": "楊枝甘露", "categories": ["DESSERT", "HEALTHY"]}, {"name": "齋滷味", "categories": ["VEGETARIAN", "HEALTHY", "SNACK"]}, {"name": "薑汁撞奶", "categories": ["DESSERT", "HEALTHY"]}, {"name": "腐竹糖水", "categories": ["DESSERT", "HEALTHY"]}, {"name": "紅豆沙", "categories": ["DESSERT", "HEALTHY"]}, {"name": "芝麻糊", "categories": ["DESSERT", "HEALTHY"]}, {"name": "花生糊", "categories": ["DESSERT", "HEALTHY"]}, {"name": "杏仁茶", "categories": ["DESSERT", "HEALTHY"]}, {"name": "番薯糖水", "categories": ["DESSERT", "HEALTHY"]}, {"name": "豆腐花", "categories": ["DESSERT", "HEALTHY"]}, {"name": "燉蛋", "categories": ["DESSERT", "HEALTHY"]}, {"name": "燉雪梨", "categories": ["DESSERT", "HEALTHY"]}, {"name": "木瓜雪耳糖水", "categories": ["DESSERT", "HEALTHY"]}, {"name": "綠豆沙", "categories": ["DESSERT", "HEALTHY"]}, {"name": "合桃露", "categories": ["DESSERT", "HEALTHY"]}, {"name": "鳳凰卷", "categories": ["DESSERT", "SNACK"]}, {"name": "老婆餅", "categories": ["DESSERT", "SNACK"]}, {"name": "雞仔餅", "categories": ["SNACK"]}, {"name": "笑口棗", "categories": ["SNACK"]}, {"name": "牛耳", "categories": ["SNACK"]}, {"name": "蛋散", "categories": ["SNACK", "DESSERT"]}, {"name": "糖不甩", "categories": ["DESSERT", "SNACK"]}, {"name": "缽仔糕", "categories": ["SNACK", "DESSERT"]}, {"name": "燉湯", "categories": ["DINNER", "HEALTHY"]}, {"name": "冬瓜盅", "categories": ["DINNER", "HEALTHY"]}, {"name": "粟米湯", "categories": ["LUNCH", "DINNER"]}, {"name": "酸辣湯", "categories": ["LUNCH", "DINNER"]}, {"name": "羅宋湯", "categories": ["LUNCH", "DINNER"]}, {"name": "忌廉湯", "categories": ["LUNCH", "DINNER"]}, {"name": "炒時蔬", "categories": ["LUNCH", "DINNER", "VEGETARIAN"]}, {"name": "蒸水蛋", "categories": ["LUNCH", "DINNER"]}, {"name": "煎釀三寶", "categories": ["LUNCH", "DINNER", "VEGETARIAN"]}, {"name": "炸雲吞", "categories": ["SNACK", "LUNCH"]}, {"name": "煎餃子", "categories": ["LUNCH", "DINNER"]}, {"name": "水餃", "categories": ["LUNCH", "DINNER"]}, {"name": "炒飯", "categories": ["LUNCH", "DINNER"]}, {"name": "湯麵", "categories": ["LUNCH", "DINNER"]}, {"name": "拌麵", "categories": ["LUNCH", "DINNER"]}, {"name": "粥", "categories": ["BREAKFAST", "HEALTHY"]}, {"name": "湯飯", "categories": ["LUNCH", "DINNER"]}, {"name": "煲仔菜", "categories": ["DINNER", "HEARTY"]}, {"name": "燜麵", "categories": ["LUNCH", "DINNER"]}, {"name": "涼拌菜", "categories": ["LUNCH", "DINNER", "VEGETARIAN"]}, {"name": "沙拉", "categories": ["LUNCH", "DINNER", "VEGETARIAN", "HEALTHY"]}, {"name": "水果拼盤", "categories": ["BREAKFAST", "DESSERT", "HEALTHY"]}, {"name": "果汁", "categories": ["BREAKFAST", "HEALTHY"]}, {"name": "酸奶", "categories": ["BREAKFAST", "HEALTHY"]}, {"name": "麥片", "categories": ["BREAKFAST", "HEALTHY"]}, {"name": "三文治", "categories": ["BREAKFAST", "LUNCH"]}, {"name": "漢堡包", "categories": ["LUNCH", "DINNER"]}];
const DAYS = ['一','二','三','四','五','六','日'];
const MEAL_META = [
  { key: 'BREAKFAST', label: '早餐', cls: 'bf' },
  { key: 'LUNCH',     label: '午餐', cls: 'lu' },
  { key: 'DINNER',    label: '晚餐', cls: 'di' },
];
let plan = null;       // plan[day][mealKey] = [dish names]
let selectedDay = (new Date().getDay() + 6) % 7;  // Mon=0

function poolFor(mealKey) {
  return MEALS.filter(m => m.categories.includes(mealKey));
}
function pick3(pool, exclude=[]) {
  const avail = pool.filter(m => !exclude.includes(m.name));
  const shuffled = [...avail].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, 3).map(m => m.name);
}
function generateWeek() {
  plan = [];
  for (let d = 0; d < 7; d++) {
    const day = {};
    for (const meta of MEAL_META) {
      day[meta.key] = pick3(poolFor(meta.key));
    }
    plan.push(day);
  }
  save(); render();
}
function shuffleMeal(dayIdx, mealKey) {
  const exclude = plan[dayIdx][mealKey];
  plan[dayIdx][mealKey] = pick3(poolFor(mealKey), exclude);
  save(); render();
}
function save() {
  try { localStorage.setItem('mealPlanV2', JSON.stringify(plan)); } catch(e) {}
}
function load() {
  try {
    const raw = localStorage.getItem('mealPlanV2');
    if (raw) { plan = JSON.parse(raw); return true; }
  } catch(e) {}
  return false;
}
function render() {
  // greeting + date
  const now = new Date();
  const h = now.getHours();
  const greet = h < 11 ? '早晨，今日食乜？' : h < 15 ? '午安，今日食乜？' : '晚安，今晚食乜？';
  document.getElementById('greeting').textContent = greet;
  document.getElementById('today').textContent =
    now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 星期' + DAYS[(now.getDay()+6)%7];

  // hero = selected day dinner
  const dLabel = selectedDay === ((now.getDay()+6)%7) ? '今晚食乜' : '星期' + DAYS[selectedDay] + '晚餐';
  document.getElementById('heroLabel').textContent = dLabel;
  document.getElementById('heroDishes').textContent = plan[selectedDay]['DINNER'].join(' · ');

  // week strip
  const weekEl = document.getElementById('week');
  weekEl.innerHTML = '';
  const base = new Date(now);
  base.setDate(base.getDate() - ((now.getDay()+6)%7)); // Monday
  for (let i = 0; i < 7; i++) {
    const dt = new Date(base); dt.setDate(dt.getDate() + i);
    const el = document.createElement('div');
    el.className = 'day' + (i === selectedDay ? ' active' : '');
    el.innerHTML = '<div class="d">' + DAYS[i] + '</div><div class="n">' + (dt.getMonth()+1) + '/' + dt.getDate() + '</div>';
    el.onclick = () => { selectedDay = i; render(); };
    weekEl.appendChild(el);
  }

  // meals
  const mealsEl = document.getElementById('meals');
  mealsEl.innerHTML = '';
  for (const meta of MEAL_META) {
    const dishes = plan[selectedDay][meta.key];
    const card = document.createElement('div');
    card.className = 'meal';
    card.innerHTML =
      '<div class="row"><span class="tag ' + meta.cls + '">' + meta.label + '</span>' +
      '<button class="shuffle" onclick="shuffleMeal(' + selectedDay + ',\'' + meta.key + '\')">🔀 換一換</button></div>' +
      '<div class="dishes">' + dishes.join(' · ') + '</div>';
    mealsEl.appendChild(card);
  }
}
if (!load()) generateWeek(); else render();
</script>
</body>
